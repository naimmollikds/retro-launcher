name: build-from-zip
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -n 1)
          echo "Using $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          SETTINGS=$(find extracted -name "settings.gradle.kts" | head -n 1)
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: retro-launcher-apk
          path: extracted/**/app-debug.apk
